context:
  version: "1.1.0"
  python_min: "3.12"

package:
  name: sohviewer
  version: ${{ version }}

source:
  url: https://gitlab.com/earthscope/public/epic/passoft/sohstationviewer/-/archive/v${{ version }}/sohstationviewer-v${{ version }}.tar.gz
  sha256: 4a1ea7b2376ec65537a7ba8e9062e8c829f9d662fb122be1d9f512034e707acb

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - sohviewer = sohstationviewer.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.23.0
    - obspy >=1.4.2
    - pyside6 >=6.7
    - matplotlib-base >=3.6.2

tests:
  - python:
      imports:
        - sohstationviewer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: Visualize State-of-Health packets from raw datalogger data
  description: |
    Visualize State-of-Health (SOH) packets from raw data recorded by different types of dataloggers.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/passoft/sohstationviewer

extra:
  recipe-maintainers:
    - omid-earthscope
